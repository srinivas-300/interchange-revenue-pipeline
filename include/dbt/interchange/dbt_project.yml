name: interchange
version: 1.0.0
config-version: 2

profile: interchange

model-paths: ["models"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
macro-paths: ["macros"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

require-dbt-version: [">=1.9.0", "<2.0.0"]

vars:
  # An authorization with no clearing after this many days is treated as expired.
  auth_expiry_days: 7

  # No source system sends us network fees, so int_txn_rated models them the way
  # card networks price: a share of the settled amount plus a fixed charge per
  # transaction. Assumption, not measured data.
  network_fee_bps: 10
  network_fee_fixed_usd: 0.02

models:
  interchange:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  interchange:
    +schema: seeds

snapshots:
  interchange:
    +target_schema: snapshots

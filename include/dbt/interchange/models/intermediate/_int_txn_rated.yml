version: 2

models:
  - name: int_txn_rated
    description: >
      One row per settled transaction, priced. Joins the card's program and region,
      as-of joins the interchange rate and cashback rate in effect on the settlement
      date, converts the amount to USD, and derives gross interchange, network fee,
      rewards accrued and net interchange. Network fees are not published by any
      source: they are modelled from the network_fee_bps and network_fee_fixed_usd
      vars. Disputed transactions are kept and flagged rather than dropped, since a
      dispute is a potential clawback, not a reversal.
    config:
      contract:
        enforced: true
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "net_interchange_usd <= gross_interchange_usd"
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              gross_interchange_usd between settled_amount_usd * 0.01
                                        and settled_amount_usd * 0.03
    columns:
      - name: transaction_id
        description: Grain of the model.
        data_type: varchar
        data_tests: [unique, not_null]
      - name: company_id
        data_type: varchar
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_companies')
                field: company_id
      - name: card_id
        data_type: varchar
        data_tests: [not_null]
      - name: merchant_id
        data_type: varchar
        data_tests: [not_null]
      - name: mcc
        data_type: varchar
        data_tests: [not_null]
      - name: spend_category
        description: Resolved through the mcc_categories seed; NULL means an unmapped MCC.
        data_type: varchar
        data_tests: [not_null]
      - name: card_program
        data_type: varchar
        data_tests: [not_null]
      - name: region
        data_type: varchar
        data_tests: [not_null]
      - name: currency
        data_type: varchar
        data_tests: [not_null]
      - name: settlement_date
        description: The date the rate lookups are made as of.
        data_type: date
        data_tests: [not_null]
      - name: settled_at
        data_type: timestamp_ntz
        data_tests: [not_null]
      - name: is_disputed
        data_type: boolean
        data_tests: [not_null]
      - name: settled_amount
        description: Settled amount in the transaction's own currency.
        data_type: number(18,2)
        data_tests: [not_null]
      - name: usd_rate
        description: USD value of one unit of the currency on the settlement date.
        data_type: number(12,6)
        data_tests: [not_null]
      - name: settled_amount_usd
        data_type: number(18,6)
        data_tests: [not_null]
      - name: bps
        description: Interchange basis points in effect on the settlement date.
        data_type: number(6,1)
        data_tests: [not_null]
      - name: cashback_pct
        description: Cashback share in effect on the settlement date.
        data_type: number(6,4)
        data_tests: [not_null]
      - name: gross_interchange_usd
        description: What the merchant's bank pays us, before our own costs.
        data_type: number(18,6)
        data_tests: [not_null]
      - name: network_fee_usd
        description: Modelled network cost; see the vars in dbt_project.yml.
        data_type: number(18,6)
        data_tests: [not_null]
      - name: rewards_accrued_usd
        description: Cashback owed to the customer on this transaction.
        data_type: number(18,6)
        data_tests: [not_null]
      - name: net_interchange_usd
        description: >
          gross - network fee - rewards. Can be negative on very small transactions,
          where the fixed per-transaction fee exceeds the interchange earned.
        data_type: number(18,6)
        data_tests: [not_null]
      - name: _loaded_at_utc
        data_type: timestamp_ntz
